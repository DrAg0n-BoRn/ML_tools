[project]
name = "dragon-ml-toolbox"
version = "28.4.0"
description = "Complete pipelines and helper tools for data science and machine learning projects."
authors = [
    { name = "Karl Luigi Loza Vidaurre", email = "luigiloza@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "polars>=2.0",
    "pyarrow",
    "joblib",
    "colorlog"
]

[project.urls]
Homepage = "https://github.com/DrAg0n-BoRn/ML_tools"
Changelog = "https://github.com/DrAg0n-BoRn/ML_tools/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# Machine Learning main toolbox. Additionally Requires PyTorch and torchvision with CUDA support
ML = [
    # Core
    "torch",
    "torchvision",
    "tqdm",
    
    # Math / ML
    "scikit-learn",
    "shap>=0.46",          # Uses KernelExplainer/DeepExplainer
    "captum",
    "evotorch",
    "torchmetrics",

    # Plots
    "matplotlib",
    "seaborn",
    "plotly",              # Interactive plots
    "kaleido",             # For static plotly image export
    "Pillow",

    # Notebook
    "ipython",
    "ipykernel",
    "notebook",
    "jupyterlab",
    "ipywidgets",
]

# ensemble tools
ensemble = [
    # Core
    "shap>=0.46",
    
    # Utilities
    "tqdm",

    # Math / ML
    "scikit-learn>=1.5.0,<1.6.0; python_version < '3.14'", # lightgbm compatibility
    "scikit-learn>=1.8.0; python_version >= '3.14'",
    "imbalanced-learn",
    "xgboost",
    "lightgbm<4.5.0; python_version < '3.14'",
    "lightgbm>=4.6.0,<4.7.0; python_version >= '3.14'",

    # Plots
    "matplotlib",
    "seaborn",

    # Notebook
    "ipython",
    "ipykernel",
    "notebook",
    "jupyterlab",
    "ipywidgets",
]

# MICE and VIF
mice = [
    "miceforest>=6.0.0",
    "plotnine>=0.12",
    "matplotlib",
    "lightgbm<4.5.0; python_version < '3.14'",
    "lightgbm>=4.6.0,<4.7.0; python_version >= '3.14'",
    "scikit-learn>=1.5.0,<1.6.0; python_version < '3.14'",
    "scikit-learn>=1.8.0; python_version >= '3.14'",
    "shap",

    # Notebook
    "ipython",
    "ipykernel",
    "notebook",
    "jupyterlab",
    "ipywidgets",
]

# NLP
NLP = [
    "scikit-learn",
    "sentence-transformers",
]

# Process excel files
excel = [
    "openpyxl",

    # Notebook
    "ipython",
    "ipykernel",
    "notebook",
    "jupyterlab",
    "ipywidgets",
]

# GUI for boost algorithms
# Optional: matplotlib / seaborn
gui-boost = [
    "FreeSimpleGUI>=5.2",
    "xgboost", 
    "lightgbm<4.5.0; python_version < '3.14'",
    "lightgbm>=4.6.0,<4.7.0; python_version >= '3.14'",
]

# GUI for Pytorch 
# Optional: Pillow / Torchvision / matplotlib / seaborn
gui-torch = [
    "torch",
    "FreeSimpleGUI>=5.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dragon*"]
namespaces = false

[dependency-groups]
dev = [
    "captum>=0.8.0",
    "evotorch>=0.6.1",
    "freesimplegui>=5.2",
    # "imbalanced-learn", #ensemble
    "ipykernel>=7.1.0",
    "ipython>=9.8.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.0",
    "kaleido>=1.3.0",
    # "lightgbm<4.5.0; python_version < '3.14'", # ensemble - mice
    # "lightgbm>=4.6.0,<4.7.0; python_version >= '3.14'", # ensemble - mice
    "matplotlib>=3.10.8",
    # "miceforest>=6.0.0", # mice
    "sentence-transformers", # NLP
    "notebook>=7.5.0",
    "openpyxl>=3.1.5",
    "pillow>=12.0.0",
    "plotly>=6.5.0",
    # "plotnine>=0.12.0", # mice
    "scikit-learn>=1.5.0,<1.6.0; python_version < '3.14'", # ensemble + ml (forced)
    "scikit-learn>=1.8.0; python_version >= '3.14'", # ensemble + ml (forced)
    "seaborn>=0.13.2",
    "shap>=0.49.1",
    "torch>=2.9.1",
    "torchmetrics>=1.5.2",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    # "xgboost" #ensemble
]
